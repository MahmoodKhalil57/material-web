<meta name="description" content="The Dialogs component of Material Web 3.0 on its own, in its first example, for audits.">
<link href="/material-web/images/favicon.svg" rel="icon" sizes="any" type="image/svg+xml">

<style>
body {
  margin: 0;
  padding: 24px;
  background: var(--md-sys-color-surface, Canvas);
  color: var(--md-sys-color-on-surface, CanvasText);
  font: var(--md-sys-typescale-body-lg, 16px/1.5 sans-serif);
}
h1 {
  margin: 0 0 24px;
  font: var(--md-sys-typescale-title-lg, 600 22px/1.3 sans-serif);
}
main > div {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
}

</style>
</head>
<body>
<main>
<h1>Dialogs</h1>
<div>
<md-gb-button id="open-delete">Delete</md-gb-button>
<md-gb-dialog id="delete-dialog">
  <span slot="headline">Permanently delete?</span>
  Deleting the selected messages also removes them from your other devices.
  <form id="delete-form" method="dialog"></form>
  <md-gb-button slot="actions" form="delete-form" value="cancel">Cancel</md-gb-button>
  <md-gb-button slot="actions" form="delete-form" value="delete">Delete</md-gb-button>
</md-gb-dialog>
</div>
</main>
<script type="module">
import '/material-web/lib/labs/gb/components/button/md-gb-button.js';
import '/material-web/lib/labs/gb/components/dialog/md-gb-dialog.js';
</script>
<script type="module">
document.querySelector('#open-delete').addEventListener('click', () => {
  document.querySelector('#delete-dialog').show();
});

</script>
</body>
</html>
