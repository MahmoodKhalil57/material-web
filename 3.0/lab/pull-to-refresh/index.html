<style>
body {
  margin: 0;
  padding: 24px;
  background: var(--md-sys-color-surface, Canvas);
  color: var(--md-sys-color-on-surface, CanvasText);
  font: var(--md-sys-typescale-body-lg, 16px/1.5 sans-serif);
}
h1 {
  margin: 0 0 24px;
  font: var(--md-sys-typescale-title-lg, 600 22px/1.3 sans-serif);
}
main > div {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
}

</style>
</head>
<body>
<main>
<h1>Pull to refresh</h1>
<div>
<md-gb-pull-to-refresh id="news" indicator-label="Refreshing news" style="block-size: 200px">
  <ul>
    <li>Markets rally on new data</li>
    <li>City opens a new bike lane</li>
    <li>Local team wins the final</li>
    <li>Weather turns cooler this week</li>
    <li>New library hours start Monday</li>
    <li>Festival lineup announced</li>
  </ul>
</md-gb-pull-to-refresh>
</div>
</main>
<script type="module">
import '/material-web/lib/labs/gb/components/pulltorefresh/md-gb-pull-to-refresh.js';
</script>
<script type="module">
const news = document.querySelector('#news');
const loadNews = () => new Promise((resolve) => setTimeout(resolve, 1500));
news.addEventListener('refresh', async () => {
  await loadNews();
  news.refreshing = false;
});

</script>
</body>
</html>
